<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Wallet -->
  <g transform="translate(8, 6) rotate(-12)" opacity="0.05" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="4" width="16" height="13" rx="2"/>
    <path d="M1 7h16"/>
    <circle cx="13" cy="11" r="1.2" fill="white" stroke="none"/>
  </g>
  <!-- Calculator -->
  <g transform="translate(68, 14) rotate(8)" opacity="0.05" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="14" height="17" rx="2"/>
    <line x1="5" y1="6" x2="11" y2="6"/>
    <line x1="5" y1="10" x2="7" y2="10"/>
    <line x1="9" y1="10" x2="11" y2="10"/>
    <line x1="5" y1="14" x2="7" y2="14"/>
    <line x1="9" y1="14" x2="11" y2="14"/>
  </g>
  <!-- Coins -->
  <g transform="translate(42, 52) rotate(-6)" opacity="0.05" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="7" cy="12" rx="6" ry="3"/>
    <path d="M1 12V6c3.3-1.7 7.7-1.7 12 0v6"/>
    <path d="M1 9c3.3-1.7 7.7-1.7 12 0"/>
  </g>
  <!-- Bank -->
  <g transform="translate(92, 72) rotate(15)" opacity="0.05" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2L1 6h14L8 2z"/>
    <line x1="3" y1="6" x2="3" y2="14"/>
    <line x1="7" y1="6" x2="7" y2="14"/>
    <line x1="13" y1="6" x2="13" y2="14"/>
    <line x1="1" y1="14" x2="15" y2="14"/>
  </g>
  <!-- Percent -->
  <g transform="translate(20, 82) rotate(-3)" opacity="0.06" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round">
    <circle cx="4" cy="4" r="2.5"/>
    <circle cx="12" cy="12" r="2.5"/>
    <line x1="14" y1="2" x2="2" y2="14"/>
  </g>
  <!-- PiggyBank -->
  <g transform="translate(56, 6) rotate(5)" opacity="0.04" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="9" cy="10" rx="8" ry="6"/>
    <path d="M5 10V8c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
    <circle cx="6" cy="9" r="0.8" fill="white" stroke="none"/>
    <path d="M7 14l-1 3"/>
    <path d="M11 14l1 3"/>
    <line x1="5" y1="4" x2="13" y2="4"/>
  </g>
  <!-- CreditCard -->
  <g transform="translate(6, 46) rotate(-8)" opacity="0.04" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="3" width="16" height="12" rx="2"/>
    <line x1="1" y1="8" x2="17" y2="8"/>
    <line x1="4" y1="12" x2="8" y2="12"/>
  </g>
  <!-- Banknote -->
  <g transform="translate(94, 24) rotate(10)" opacity="0.04" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="3" width="16" height="12" rx="2"/>
    <ellipse cx="9" cy="9" rx="3" ry="3"/>
    <text x="7.5" y="11" font-size="5" fill="white" stroke="none" font-family="sans-serif" opacity="0.7">$</text>
  </g>
  <!-- Receipt -->
  <g transform="translate(32, 96) rotate(-10)" opacity="0.04" fill="none" stroke="white" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 1h10v16l-2-1.5L10 17l-2-1.5L6 17 4 15.5 2 17V1z"/>
    <line x1="7" y1="5" x2="11" y2="5"/>
    <line x1="7" y1="8" x2="11" y2="8"/>
    <line x1="7" y1="11" x2="9" y2="11"/>
  </g>
  <!-- TrendingUp -->
  <g transform="translate(72, 92) rotate(7)" opacity="0.04" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="1 12 5 6 9 9 16 1"/>
    <polyline points="11 1 16 1 16 6"/>
  </g>
</svg>
