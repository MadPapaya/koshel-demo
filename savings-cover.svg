<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0fa89e" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0fa89e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0fa89e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Concentric rings (ripple) -->
  <g fill="none" stroke="#0fa89e" stroke-linecap="round" stroke-width="2">
    <circle cx="650" cy="260" r="40"  stroke-opacity="0.30"/>
    <circle cx="650" cy="260" r="90"  stroke-opacity="0.24"/>
    <circle cx="650" cy="260" r="140" stroke-opacity="0.18"/>
    <circle cx="650" cy="260" r="190" stroke-opacity="0.13"/>
    <circle cx="650" cy="260" r="240" stroke-opacity="0.09"/>
    <circle cx="650" cy="260" r="290" stroke-opacity="0.06"/>
  </g>

  <!-- Soft radial glow at center -->
  <circle cx="650" cy="260" r="130" fill="url(#centerGlow)"/>

  <!-- Core dot -->
  <circle cx="650" cy="260" r="9" fill="#0fa89e" fill-opacity="0.55"/>

  <!-- Accent dots on outer rings -->
  <g fill="#ffffff" fill-opacity="0.12">
    <circle cx="650" cy="90"  r="3"/>
    <circle cx="850" cy="260" r="3"/>
    <circle cx="650" cy="470" r="3"/>
    <circle cx="460" cy="260" r="3"/>
  </g>
</svg>